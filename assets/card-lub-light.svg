<svg xmlns="http://www.w3.org/2000/svg" width="410" height="182" viewBox="0 0 410 182" role="img" aria-label="LUB  ·  لُبّ — STUDENT CLUBS &amp; COUNCILS PLATFORM">
  <defs>
    <linearGradient id="cardAccent-lub-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969DA" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
    <clipPath id="cardClip-lub-light">
      <rect x="0.5" y="0.5" width="409" height="181" rx="10" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip-lub-light)">
    <rect x="0.5" y="0.5" width="409" height="181" rx="10" fill="#FFFFFF" />
    <rect x="0" y="0" width="410" height="2.5" fill="url(#cardAccent-lub-light)" />

    <!-- Icon & Title -->
    
    <g transform="translate(20, 23)" fill="none" stroke="#0969DA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="8,1.8 14.2,5.1 8,8.4 1.8,5.1"/>
      <polyline points="1.8,8.4 8,11.7 14.2,8.4"/>
      <polyline points="1.8,11.6 8,14.9 14.2,11.6"/>
    </g>
    <text x="44" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1F2328">LUB  ·  لُبّ</text>

    <!-- Status Pill -->
    <rect x="298" y="20" width="92" height="22" rx="11" fill="#EDF5FF" stroke="#BBD8FA" stroke-width="1" />
    <text x="344.0" y="34.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#0969DA">Live · Team</text>

    <!-- Category Kicker -->
    <text x="20" y="61" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="0.85" fill="#0969DA">STUDENT CLUBS &amp; COUNCILS PLATFORM</text>

    <!-- Description -->
    <text x="20" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">Collaborative graduation project for club operations,</text>
    <text x="20" y="107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">events, memberships, hours &amp; role-based workflows.</text>

    <!-- Footer Divider -->
    <line x1="20" y1="130" x2="390" y2="130" stroke="#E6EBF1" stroke-width="1" />

    <!-- Tech Indicators -->
    <circle cx="24" cy="154" r="4" fill="#3178C6" />
    <text x="33" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#57606A">TypeScript</text>
    <circle cx="114" cy="154" r="4" fill="#1F2328" />
    <text x="123" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#57606A">Next.js</text>
    <circle cx="182" cy="154" r="4" fill="#4169E1" />
    <text x="191" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#57606A">PostgreSQL</text>

    <!-- Footer Meta -->
    <text x="390" y="158" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#6E7781">lub.community</text>

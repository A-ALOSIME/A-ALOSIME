<svg xmlns="http://www.w3.org/2000/svg" width="410" height="182" viewBox="0 0 410 182" role="img" aria-label="IEEE-IMSIU — IEEE STUDENT BRANCH PORTAL &amp; ADMIN">
  <defs>
    <linearGradient id="cardAccent-ieee-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#2F81F7" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#2F81F7" stop-opacity="0" />
    </linearGradient>
    <clipPath id="cardClip-ieee-dark">
      <rect x="0.5" y="0.5" width="409" height="181" rx="10" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip-ieee-dark)">
    <rect x="0.5" y="0.5" width="409" height="181" rx="10" fill="#0D1117" />
    <rect x="0" y="0" width="410" height="2.5" fill="url(#cardAccent-ieee-dark)" />

    <!-- Icon & Title -->
    
    <g transform="translate(20, 23)" fill="none" stroke="#58A6FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="8" r="6.2"/>
      <ellipse cx="8" cy="8" rx="2.8" ry="6.2"/>
      <line x1="1.8" y1="8" x2="14.2" y2="8"/>
    </g>
    <text x="44" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#F0F6FC">IEEE-IMSIU</text>

    <!-- Status Pill -->
    <rect x="298" y="20" width="92" height="22" rx="11" fill="#151F2E" stroke="#253954" stroke-width="1" />
    <text x="344.0" y="34.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#79C0FF">Live · Edge</text>

    <!-- Category Kicker -->
    <text x="20" y="61" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="0.85" fill="#58A6FF">IEEE STUDENT BRANCH PORTAL &amp; ADMIN</text>

    <!-- Description -->
    <text x="20" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9BA3AE">Bilingual (AR/EN) branch site and operations portal</text>
    <text x="20" y="107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9BA3AE">for events, members, committees &amp; email delivery.</text>

    <!-- Footer Divider -->
    <line x1="20" y1="130" x2="390" y2="130" stroke="#1B2230" stroke-width="1" />

    <!-- Tech Indicators -->
    <circle cx="24" cy="154" r="4" fill="#FF5D01" />
    <text x="33" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#9BA3AE">Astro</text>
    <circle cx="82" cy="154" r="4" fill="#3178C6" />
    <text x="91" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#9BA3AE">TypeScript</text>
    <circle cx="174" cy="154" r="4" fill="#F38020" />
    <text x="183" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#9BA3AE">Cloudflare</text>

    <!-- Footer Meta -->
    <text x="390" y="158" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#7D8590">ieeeimsiu.com</text>

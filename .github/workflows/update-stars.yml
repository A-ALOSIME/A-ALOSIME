name: Update Total Stars Earned

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update total stars earned SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_stars.py

      - name: Commit updated assets if changed
        run: |
          if git diff --quiet assets/stars-dark.svg assets/stars-light.svg; then
            echo "No star count change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stars-dark.svg assets/stars-light.svg
          git commit -m "chore: update total stars earned"
          git push
